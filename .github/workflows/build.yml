name: Build APK Launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Siapkan Android SDK runner
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          SDKMANAGER="$(find "$SDK" /usr/local/lib/android/sdk -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          test -n "$SDKMANAGER" || { echo "sdkmanager tidak ditemukan di runner"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "PATH=$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH" >> "$GITHUB_ENV"

      - name: Build APK launcher-only
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storm-connections-launcher-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Simpan laporan jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-reports
          path: android/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
